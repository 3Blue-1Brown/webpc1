<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nam Nguyễn PC & Workstation - Tìm kiếm & Lọc sản phẩm</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <style>
    .filter-panel { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .filter-panel label { font-weight: 600; }
    .filter-panel select,
    .filter-panel input { padding: 0.4rem 0.6rem; border: 1px solid #d1d5db; border-radius: 6px; }
    @media (max-width: 768px) { .filter-panel { flex-direction: column; } }
  </style>
</head>
<body>
  <!-- Header (reuse) -->
  <header class="site-header">
    <div class="logo"><a href="index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;"><img src="logo.png" alt="Nam Nguyễn Logo" style="height: 48px; width: auto; object-fit: contain;"><div style="display:flex; flex-direction:column; line-height:1.2;"><span style="font-weight:700; font-size:1.3rem; color:#ffffff; letter-spacing:0.5px;">Nam Nguyễn</span><span style="font-weight:700; font-size:0.75rem; color:#facc15; text-transform:uppercase; letter-spacing:1px;">PC &amp; Workstation</span></div></a></div>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="categories.html">Danh mục</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
        <li><a href="pc-builder.html">Xây Dựng Cấu Hình</a></li>
        <li><a href="about.html">Giới thiệu</a></li>
        <li><a href="contact.html">Liên hệ</a></li>
        <li><a href="cart.html" class="cart-link">Giỏ hàng (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
    <div class="search-wrap">
      <input type="text" placeholder="Tìm kiếm sản phẩm..." id="search-input" />
      <button id="search-btn">🔍</button>
    </div>
  </header>
  <!-- Category Subnav -->
  <nav class="category-subnav">
    <ul id="dynamic-category-subnav">
      <!-- Injected via JS -->
    </ul>
  </nav>

  <main class="site-main">
    <section class="filter-panel">
      <div>
        <label for="filter-name">Tên</label><br/>
        <input type="text" id="filter-name" placeholder="Tên sản phẩm" />
      </div>
      <div>
        <label for="filter-category">Danh mục</label><br/>
        <select id="filter-category">
          <option value="All">Tất cả</option>
        </select>
      </div>
      <div>
        <label for="filter-price-min">Giá từ</label><br/>
        <input type="number" id="filter-price-min" min="0" placeholder="0" />
      </div>
      <div>
        <label for="filter-price-max">Giá tới</label><br/>
        <input type="number" id="filter-price-max" min="0" placeholder="∞" />
      </div>

      <div>
        <label for="filter-condition">Tình trạng</label><br/>
        <select id="filter-condition">
          <option value="All">Tất cả</option>
          <option value="new">Mới</option>
          <option value="used">Cũ</option>
        </select>
      </div>
      <div style="align-self:end;">
        <button id="apply-filters" style="background:var(--gold);color:var(--dark);border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer;">Áp dụng</button>
      </div>
    </section>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer class="site-footer">
    <p>© 2026 NAM NGUYỄN PC & WORKSTATION. All rights reserved.</p>
  </footer>

  <script src="js/image-utils.js"></script>
  <script src="cart.js"></script>
  <script src="product-card.js"></script>
  <script src="zalo-qr-modal.js"></script>
  <script>
    const apiUrl = '/api/products';
    let allProducts = [];

    async function loadAll() {
      try {
        const res = await fetch(apiUrl);
        allProducts = await res.json();
        
        // Fetch categories
        const catRes = await fetch('/api/categories');
        const cats = await catRes.json();
        const select = document.getElementById('filter-category');
        if (select && Array.isArray(cats)) {
          cats.forEach(c => {
            select.innerHTML += `<option value="${c.ten_danh_muc}">${c.ten_danh_muc}</option>`;
          });
        }

        // Parse URL search parameter ?q= or ?search=
        const urlParams = new URLSearchParams(window.location.search);
        const qParam = urlParams.get('q') || urlParams.get('search') || '';
        if (qParam) {
          const filterNameInput = document.getElementById('filter-name');
          const headerSearchInput = document.getElementById('search-input');
          if (filterNameInput) filterNameInput.value = qParam;
          if (headerSearchInput) headerSearchInput.value = qParam;
        }

        applyFilters();
      } catch (e) { console.error('Load error', e); }
    }

    function render(list) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:3rem; font-size:1.1rem; color:#64748b;">Không tìm thấy sản phẩm phù hợp.</div>';
        return;
      }
      list.forEach(p => {
        grid.appendChild(buildProductCard(p));
      });
    }

    function mapKeywordToCategories(normQuery) {
      if (!normQuery) return null;
      const q = normQuery.trim().toLowerCase();

      if (q === 'cpu') {
        return ['CPU PC', 'CPU SEVER', 'CPU SERVER'];
      }
      if (q === 'main' || q === 'mainboard' || q === 'bo mach' || q === 'bo mach chu') {
        return ['MAINBOARD PC', 'MAINBOARD SEVER', 'MAINBOARD SERVER'];
      }
      if (q === 'ram') {
        return ['RAM PC', 'RAM SEVER', 'RAM SERVER'];
      }
      if (q === 'vga' || q === 'card' || q === 'card do hoa' || q === 'gpu') {
        return ['CARD ĐỒ HỌA'];
      }
      if (q === 'ssd' || q === 'o cung' || q === 'o cung ssd' || q === 'hdd') {
        return ['Ổ CỨNG SSD'];
      }
      if (q === 'nguon' || q === 'nguon may tinh' || q === 'psu') {
        return ['NGUỒN MÁY TÍNH'];
      }
      if (q === 'tan nhiet' || q === 'tan nhiet cpu' || q === 'cooler') {
        return ['TẢN NHIỆT CPU'];
      }
      if (q === 'vo' || q === 'vo case' || q === 'vo may tinh' || q === 'case') {
        return ['VỎ MÁY TÍNH'];
      }
      if (q === 'man hinh' || q === 'man hinh may tinh' || q === 'monitor') {
        return ['MÀN HÌNH MÁY TÍNH'];
      }
      if (q === 'laptop') {
        return ['LAPTOP'];
      }

      return null;
    }

    function applyFilters() {
      const nameInput = document.getElementById('filter-name');
      const searchHeaderInput = document.getElementById('search-input');
      const rawSearch = (nameInput && nameInput.value.trim()) || (searchHeaderInput && searchHeaderInput.value.trim()) || '';
      const category = document.getElementById('filter-category').value;
      const priceMin = parseFloat(document.getElementById('filter-price-min').value);
      const priceMax = parseFloat(document.getElementById('filter-price-max').value);
      const condition = document.getElementById('filter-condition').value;

      let filtered = allProducts;

      if (rawSearch) {
        const normQuery = typeof window.removeAccents === 'function' ? window.removeAccents(rawSearch) : rawSearch.toLowerCase();

        // 0. Keyword category mapping check (e.g. "cpu" -> ["CPU PC", "CPU SEVER"])
        const targetCategories = mapKeywordToCategories(normQuery);

        if (targetCategories && targetCategories.length > 0) {
          filtered = filtered.filter(p => {
            const pCat = (p.ten_danh_muc || '').toUpperCase();
            return targetCategories.some(c => pCat === c.toUpperCase() || pCat.includes(c.toUpperCase()));
          });
        } else {
          // 1. Primary search: Match in Product Name, Category Name, or Brand
          let primaryFiltered = filtered.filter(p => {
            const pName = typeof window.removeAccents === 'function' ? window.removeAccents(p.ten_san_pham) : (p.ten_san_pham || '').toLowerCase();
            const pCat = typeof window.removeAccents === 'function' ? window.removeAccents(p.ten_danh_muc) : (p.ten_danh_muc || '').toLowerCase();
            const pBrand = typeof window.removeAccents === 'function' ? window.removeAccents(p.hang_san_xuat) : (p.hang_san_xuat || '').toLowerCase();

            return pName.includes(normQuery) || pCat.includes(normQuery) || pBrand.includes(normQuery);
          });

          // 2. Secondary fallback: Only check description/specs if primary search returned 0 results
          if (primaryFiltered.length > 0) {
            filtered = primaryFiltered;
          } else {
            filtered = filtered.filter(p => {
              const pDesc = typeof window.removeAccents === 'function' ? window.removeAccents(p.mo_ta) : (p.mo_ta || '').toLowerCase();
              const pSpec = typeof window.removeAccents === 'function' ? window.removeAccents(p.thong_so_ky_thuat) : (p.thong_so_ky_thuat || '').toLowerCase();
              return pDesc.includes(normQuery) || pSpec.includes(normQuery);
            });
          }
        }
      }

      if (category !== 'All') {
        filtered = filtered.filter(p => p.ten_danh_muc === category);
      }
      if (!isNaN(priceMin) && priceMin >= 0) {
        filtered = filtered.filter(p => (p.gia || 0) >= priceMin);
      }
      if (!isNaN(priceMax) && priceMax >= 0) {
        filtered = filtered.filter(p => (p.gia || 0) <= priceMax);
      }
      if (condition === 'new') {
        filtered = filtered.filter(p => p.trang_thai);
      } else if (condition === 'used') {
        filtered = filtered.filter(p => !p.trang_thai);
      }

      render(filtered);
    }

    if (document.getElementById('apply-filters')) {
      document.getElementById('apply-filters').addEventListener('click', applyFilters);
    }

    // Live sync & instant filtering for search inputs
    const headerInput = document.getElementById('search-input');
    const filterInput = document.getElementById('filter-name');

    function syncAndFilter(val) {
      if (headerInput && headerInput.value !== val) headerInput.value = val;
      if (filterInput && filterInput.value !== val) filterInput.value = val;
      applyFilters();
    }

    if (headerInput) {
      ['input', 'change', 'keyup', 'search'].forEach(evt => {
        headerInput.addEventListener(evt, (e) => {
          syncAndFilter(e.target.value);
        });
      });
    }

    if (filterInput) {
      ['input', 'change', 'keyup', 'search'].forEach(evt => {
        filterInput.addEventListener(evt, (e) => {
          syncAndFilter(e.target.value);
        });
      });
    }

    const sBtn = document.getElementById('search-btn');
    if (sBtn) {
      sBtn.onclick = () => syncAndFilter(headerInput ? headerInput.value : '');
    }

    loadAll();
  </script>
</body>
</html>
