<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Nam Nguyễn PC & Workstation</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <style>
    .auth-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .auth-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--dark);
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-auth {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-auth:hover {
      background: #e65100;
    }
    .auth-links {
      text-align: center;
      margin-top: 15px;
    }
    .auth-links a {
      color: var(--orange);
      text-decoration: none;
    }
    #login-error {
      color: red;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="logo"><a href="index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;"><img src="logo.png" alt="Nam Nguyễn Logo" style="height: 48px; width: auto; object-fit: contain;"><div style="display:flex; flex-direction:column; line-height:1.2;"><span style="font-weight:700; font-size:1.3rem; color:#ffffff; letter-spacing:0.5px;">Nam Nguyễn</span><span style="font-weight:700; font-size:0.75rem; color:#facc15; text-transform:uppercase; letter-spacing:1px;">PC &amp; Workstation</span></div></a></div>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="categories.html">Danh mục</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
        <li><a href="about.html">Giới thiệu</a></li>
        <li><a href="contact.html">Liên hệ</a></li>
        <li><a href="cart.html" class="cart-link">🛒 Giỏ hàng (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
    <div class="search-wrap">
      <input type="text" placeholder="Tìm kiếm sản phẩm..." id="search-input" />
      <button id="search-btn">🔍</button>
    </div>
  </header>

  <div class="auth-container">
    <h2>Đăng nhập</h2>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Tên đăng nhập hoặc Email</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn-auth">Đăng nhập</button>
    </form>
    <div class="auth-links">
      Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameOrEmail = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernameOrEmail, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          if (data.user.role === 'admin' || data.user.role === 'manager') {
            localStorage.setItem('adminToken', data.token);
            localStorage.setItem('adminUser', JSON.stringify(data.user));
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/admin/index.html';
          } else {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = 'index.html';
          }
        } else {
          errorDiv.textContent = data.error || 'Đăng nhập thất bại';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Lỗi kết nối';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
