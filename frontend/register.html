<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Ký - Nam Nguyễn PC & Workstation</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <style>
    .auth-container {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .auth-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--dark);
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-auth {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-auth:hover {
      background: #e65100;
    }
    .auth-links {
      text-align: center;
      margin-top: 15px;
    }
    .auth-links a {
      color: var(--orange);
      text-decoration: none;
    }
    #register-error {
      color: red;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="logo"><a href="index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;"><img src="logo.png" alt="Nam Nguyễn Logo" style="height: 48px; width: auto; object-fit: contain;"><div style="display:flex; flex-direction:column; line-height:1.2;"><span style="font-weight:700; font-size:1.3rem; color:#ffffff; letter-spacing:0.5px;">Nam Nguyễn</span><span style="font-weight:700; font-size:0.75rem; color:#facc15; text-transform:uppercase; letter-spacing:1px;">PC &amp; Workstation</span></div></a></div>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">🏠 Trang chủ</a></li>
        <li><a href="categories.html">📂 Danh mục</a></li>
        <li><a href="products.html">🖥️ Sản phẩm</a></li>
        <li><a href="pc-builder.html">🛠️ Xây Dựng Cấu Hình</a></li>
        <li><a href="about.html">ℹ️ Giới thiệu</a></li>
        <li><a href="contact.html">📞 Liên hệ</a></li>
        <li><a href="cart.html" class="cart-link">🛒 Giỏ hàng (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
    <div class="search-wrap">
      <input type="text" placeholder="Tìm kiếm sản phẩm..." id="search-input" />
      <button id="search-btn">🔍</button>
    </div>
  </header>

  <div class="auth-container">
    <h2>Đăng Ký Tài Khoản</h2>
    <div id="register-error"></div>
    <form id="register-form">
      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn-auth">Đăng Ký</button>
    </form>
    <div class="auth-links">
      Đã có tài khoản? <a href="login.html">Đăng nhập</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value;
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('register-error');
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, username, email, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert('Đăng ký thành công! Hãy đăng nhập.');
          window.location.href = 'login.html';
        } else {
          errorDiv.textContent = data.error || data.errors?.[0]?.msg || 'Đăng ký thất bại';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Lỗi kết nối';
        errorDiv.style.display = 'block';
      }
    });
  </script>
  <script src="cart.js"></script>
</body>
</html>
